# This workflow will build a Java project with Ant
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-ant

name: HiFINI-Auto-CheckIn

on:
  workflow_dispatch:
  schedule:
    - cron: "0 18 * * *" # 北京时间凌晨 02:00 (UTC 18:00)

jobs:
  build:
    env:
      HIFINI_USERNAME: ${{ secrets.HIFINI_USERNAME }}
      HIFINI_PASSWORD: ${{ secrets.HIFINI_PASSWORD }}
      WXPUSHER_APP_TOKEN: ${{ secrets.WXPUSHER_APP_TOKEN }}
      WXPUSHER_UID: ${{ secrets.WXPUSHER_UID }}
      ENABLE_RANDOM_DELAY: ${{ github.event_name == 'schedule' && 'true' || 'false' }}
      COOKIE: ${{ secrets.COOKIE }}
      HIFIHI_COOKIE: ${{ secrets.HIFIHI_COOKIE }}
      SERVER_CHAN: ${{ secrets.SERVER_CHAN }}
      DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
      WXWORK_WEBHOOK: ${{ secrets.WXWORK_WEBHOOK }}
      TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
      TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
      GOTIFY_URL: ${{ secrets.GOTIFY_URL }}
      GOTIFY_APP_TOKEN: ${{ secrets.GOTIFY_APP_TOKEN }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install Playwright Dependencies
        run: |
          pip install playwright requests
          playwright install --with-deps chromium
      - name: Run Full Auto Playwright CheckIn
        run: |
          python scripts/checkin.py
      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'
          cache: 'maven'
      - name: Build and Run Java Engine
        run: |
          mvn clean compile exec:java \
          -Dexec.mainClass="cloud.ohiyou.HifiniApplication" \
          -Dexec.cleanupDaemonThreads=false
    permissions:
      contents: read    # 允许 checkout 代码   
