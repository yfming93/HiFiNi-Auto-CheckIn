# HiFiNi 磁场自动签到 GitHub Actions 工作流
# 主引擎: curl (OpenSSL TLS, 绕过 CDN 指纹阻断)
# 备用引擎: Java OkHttp

name: HiFINI-Auto-CheckIn

on:
  workflow_dispatch:
  schedule:
    - cron: "0 18 * * *" # 北京时间凌晨 02:00 (UTC 18:00)

jobs:
  build:
    env:
      HIFINI_USERNAME: ${{ secrets.HIFINI_USERNAME }}
      HIFINI_PASSWORD: ${{ secrets.HIFINI_PASSWORD }}
      WXPUSHER_APP_TOKEN: ${{ secrets.WXPUSHER_APP_TOKEN }}
      WXPUSHER_UID: ${{ secrets.WXPUSHER_UID }}
      ENABLE_RANDOM_DELAY: ${{ github.event_name == 'schedule' && 'true' || 'false' }}
      COOKIE: ${{ secrets.COOKIE }}
      HIFIHI_COOKIE: ${{ secrets.HIFIHI_COOKIE }}
      HIFINI_DOMAINS: "https://www.hifini.com.cn,https://www.hifihi.com,https://www.hifini.net,https://www.hifini.com"
      SERVER_CHAN: ${{ secrets.SERVER_CHAN }}
      DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
      WXWORK_WEBHOOK: ${{ secrets.WXWORK_WEBHOOK }}
      TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
      TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
      GOTIFY_URL: ${{ secrets.GOTIFY_URL }}
      GOTIFY_APP_TOKEN: ${{ secrets.GOTIFY_APP_TOKEN }}
      PROXY_WORKER_URL: ${{ secrets.PROXY_WORKER_URL }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Curl CheckIn Engine (主引擎 - OpenSSL TLS)
        id: curl_checkin
        run: bash scripts/curl_checkin.sh
        continue-on-error: true

      - name: Set up JDK 8
        if: steps.curl_checkin.outcome == 'failure'
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'
          cache: 'maven'

      - name: Java CheckIn Engine (备用引擎)
        if: steps.curl_checkin.outcome == 'failure'
        run: |
          echo "curl 引擎签到失败，启动 Java 备用引擎..."
          mvn clean compile exec:java \
          -Dexec.mainClass="cloud.ohiyou.HifiniApplication" \
          -Dexec.cleanupDaemonThreads=false
    permissions:
      contents: read
